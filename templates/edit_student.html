<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #243b55;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Edit Student</h1>

    <form method="POST">

        <label for="name">Name</label>
        <input
            type="text"
            id="name"
            name="name"
            maxlength="100"
            value="{{ student.name }}"
            required
        >

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            maxlength="100"
            value="{{ student.email }}"
            required
        >

        <label for="department">Department</label>
        <input
            type="text"
            id="department"
            name="department"
            maxlength="50"
            value="{{ student.department }}"
            required
        >

        <label for="cgpa">CGPA</label>
        <input
            type="number"
            id="cgpa"
            name="cgpa"
            min="0"
            max="10"
            step="0.01"
            value="{{ student.cgpa }}"
            required
        >

        <button type="submit">Update Student</button>

    </form>

    <p><a href="/">Back to Dashboard</a></p>

</div>

</body>
</html>
